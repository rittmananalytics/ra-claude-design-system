<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Booksy Innovation Day · Pitch deck</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;height:100%;background:#1A1B22;color:#fff;font-family:var(--ra-font-deck-body)}*{box-sizing:border-box}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.frame{width:1280px;height:720px;transform-origin:center;box-shadow:0 30px 90px rgba(0,0,0,.55);background:#fff}
.frame iframe{width:1280px;height:720px;border:0;display:block}
.chrome{position:fixed;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10;font:500 12px/1 var(--ra-font-deck-ui);color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase}
.chrome .brand{display:flex;align-items:center;gap:10px}.chrome img{height:18px;opacity:.85}
.nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(28,30,40,.92);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:8px 10px;z-index:10}
.nav button{background:transparent;border:0;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.nav button:hover{background:rgba(255,255,255,.1)}.nav button:disabled{opacity:.3;cursor:not-allowed}
.nav .c{font:600 13px/1 var(--ra-font-deck-ui);padding:0 8px;min-width:56px;text-align:center}
.nav .c small{color:rgba(255,255,255,.5)}
.nav .l{font:500 12px/1 var(--ra-font-deck-ui);color:rgba(255,255,255,.7);padding-left:14px;border-left:1px solid rgba(255,255,255,.1);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4F60FF"></rect><rect x="30" y="34" width="40" height="26" rx="3" fill="#fff"></rect><rect x="34" y="40" width="20" height="4" rx="2" fill="#4F60FF"></rect><rect x="34" y="48" width="28" height="3" rx="1.5" fill="#B7C0FF"></rect><rect x="46" y="62" width="8" height="3" rx="1.5" fill="#fff"></rect></svg></template>
<div class="chrome"><div class="brand"><img src="../assets/logo-white-blue.svg" alt="">Booksy Innovation Day · pitch</div><div id="sn">01 · Title</div></div>
<div class="stage"><div class="frame"><iframe id="f" src="slides/01-title.html"></iframe></div></div>
<div class="nav"><button id="p">‹</button><span class="c"><span id="cur">1</span><small>/14</small></span><button id="n">›</button><span class="l" id="lab">Title</span></div>
<script>
const S=[{"src":"slides/01-title.html","label":"Title"},{"src":"slides/02-intro.html","label":"Introductions"},{"src":"slides/03-agenda.html","label":"Agenda"},{"src":"slides/04-sec-now.html","label":"Where we are now"},{"src":"slides/05-foundation.html","label":"Building the foundation"},{"src":"slides/06-pdm.html","label":"Physical data model"},{"src":"slides/07-impact.html","label":"The impact"},{"src":"slides/08-sec-next.html","label":"What comes next"},{"src":"slides/09-building.html","label":"Building together"},{"src":"slides/10-sec-possible.html","label":"What is now possible"},{"src":"slides/11-conversational.html","label":"Conversational Analytics"},{"src":"slides/12-gemini.html","label":"Gemini Enterprise"},{"src":"slides/13-sec-go.html","label":"Where can this go"},{"src":"slides/14-questions.html","label":"Q&A"}];
let i=0;const f=document.getElementById('f'),cur=document.getElementById('cur'),lab=document.getElementById('lab'),sn=document.getElementById('sn'),p=document.getElementById('p'),n=document.getElementById('n');
function paint(){f.src=S[i].src;cur.textContent=i+1;lab.textContent=S[i].label;sn.textContent=String(i+1).padStart(2,'0')+' · '+S[i].label;p.disabled=i===0;n.disabled=i===S.length-1;try{localStorage.setItem('booksy-slide',i)}catch(e){}}
p.onclick=()=>{if(i>0){i--;paint()}};n.onclick=()=>{if(i<S.length-1){i++;paint()}};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='PageUp')p.click();else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')n.click()});
try{const v=parseInt(localStorage.getItem('booksy-slide')||'0');if(v>=0&&v<S.length)i=v}catch(e){}
function fit(){const fr=document.querySelector('.frame');fr.style.transform='scale('+Math.min(innerWidth/1280,(innerHeight-80)/720,1)+')'}
fit();addEventListener('resize',fit);paint();
</script></body></html>
