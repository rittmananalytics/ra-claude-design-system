<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--ra-font-body);display:flex;flex-wrap:wrap;gap:10px}
.chip{font:600 12px var(--ra-font-ui);padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.indigo{background:#E0E0FF;color:#3340c4}
.violet{background:#E6DBFF;color:#5d3da8}
.mint{background:#EBFFEB;color:#1f7a3a}
.sky{background:#E7F7FE;color:#125a85}
.peach{background:#FFBBBE;color:#9a2c1d}
.outline{background:#fff;color:#181B25;border:1px solid #E1E1E9}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

<span class="chip indigo"><span class="dot"></span>dbt</span>
<span class="chip violet">BigQuery</span>
<span class="chip mint">Looker</span>
