<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, ghost, link" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;gap:16px;flex-wrap:wrap;font-family:var(--ra-font-ui)}
button{font:600 14px var(--ra-font-ui);border-radius:8px;padding:12px 20px;cursor:pointer;border:1px solid transparent;transition:all .2s}
.primary{background:#4F60FF;color:#fff;box-shadow:0 8px 20px rgba(50,50,93,.08),0 2px 6px rgba(0,0,0,.04)}
.primary:hover{background:#4555e5}
.secondary{background:#F7F7FA;color:#181B25}
.secondary:hover{background:#EFF0F4}
.ghost{background:transparent;color:#4F60FF}
.ghost:hover{color:#4555e5;text-decoration:underline}
.outline{background:#fff;color:#181B25;border:1px solid #E1E1E9}
.outline:hover{border-color:#181B25}
.lg{padding:16px 28px;font-size:16px}
</style></head><body>
<button class="primary lg">Schedule a Discovery Call</button>
<button class="primary">Get Started</button>
<button class="secondary">Learn More</button>
<button class="outline">Contact Sales</button>
<button class="ghost">Read More ›</button>
</body></html>
