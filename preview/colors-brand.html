<!doctype html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Indigo, violet, mint, sky, peach" viewport="700x140" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--ra-font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;width:108px}
.sw .c{height:64px;border-radius:8px;border:1px solid var(--ra-line)}
.sw .l{font:600 11px var(--ra-font-ui);color:var(--ra-ink);margin-top:6px}
.sw .h{font:400 10px var(--ra-font-mono);color:var(--ra-mute-strong)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="c" style="background:#4F60FF"></div><div class="l">Indigo</div><div class="h">#4F60FF</div></div>
  <div class="sw"><div class="c" style="background:#AD86FF"></div><div class="l">Violet</div><div class="h">#AD86FF</div></div>
  <div class="sw"><div class="c" style="background:#99FF99"></div><div class="l">Mint</div><div class="h">#99FF99</div></div>
  <div class="sw"><div class="c" style="background:#87D5FC"></div><div class="l">Sky</div><div class="h">#87D5FC</div></div>
  <div class="sw"><div class="c" style="background:#FF8D73"></div><div class="l">Peach</div><div class="h">#FF8D73</div></div>
</div>
</body></html>
