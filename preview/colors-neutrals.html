<!doctype html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="Ink, mute, line, paper" viewport="700x130" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--ra-font-body)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;width:96px}
.sw .c{height:56px;border-radius:6px;border:1px solid var(--ra-line)}
.sw .l{font:600 11px var(--ra-font-ui);color:var(--ra-ink);margin-top:6px}
.sw .h{font:400 10px var(--ra-font-mono);color:var(--ra-mute-strong)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="c" style="background:#181B25"></div><div class="l">Ink</div><div class="h">#181B25</div></div>
  <div class="sw"><div class="c" style="background:#2B3041"></div><div class="l">Ink 70</div><div class="h">#2B3041</div></div>
  <div class="sw"><div class="c" style="background:#4F5564"></div><div class="l">Ink 40</div><div class="h">#4F5564</div></div>
  <div class="sw"><div class="c" style="background:#6B7280"></div><div class="l">Mute strong</div><div class="h">#6B7280</div></div>
  <div class="sw"><div class="c" style="background:#9BA1A6"></div><div class="l">Mute</div><div class="h">#9BA1A6</div></div>
  <div class="sw"><div class="c" style="background:#E1E1E9"></div><div class="l">Line</div><div class="h">#E1E1E9</div></div>
  <div class="sw"><div class="c" style="background:#F7F7FA"></div><div class="l">Paper 2</div><div class="h">#F7F7FA</div></div>
  <div class="sw"><div class="c" style="background:#FFFFFF"></div><div class="l">Paper</div><div class="h">#FFFFFF</div></div>
</div>
</body></html>
