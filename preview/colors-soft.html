<!doctype html>
<!-- @dsCard group="Colors" name="Soft tints" subtitle="Card-fill tints — paired with ink" viewport="700x140" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--ra-font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;width:108px}
.sw .c{height:64px;border-radius:8px;border:1px solid var(--ra-line)}
.sw .l{font:600 11px var(--ra-font-ui);color:var(--ra-ink);margin-top:6px}
.sw .h{font:400 10px var(--ra-font-mono);color:var(--ra-mute-strong)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="c" style="background:#E0E0FF"></div><div class="l">Indigo soft</div><div class="h">#E0E0FF</div></div>
  <div class="sw"><div class="c" style="background:#E6DBFF"></div><div class="l">Violet soft</div><div class="h">#E6DBFF</div></div>
  <div class="sw"><div class="c" style="background:#EBFFEB"></div><div class="l">Mint soft</div><div class="h">#EBFFEB</div></div>
  <div class="sw"><div class="c" style="background:#E7F7FE"></div><div class="l">Sky soft</div><div class="h">#E7F7FE</div></div>
  <div class="sw"><div class="c" style="background:#FFBBBE"></div><div class="l">Peach soft</div><div class="h">#FFBBBE</div></div>
  <div class="sw"><div class="c" style="background:#EFF0FF"></div><div class="l">Indigo haze</div><div class="h">#EFF0FF</div></div>
</div>
</body></html>
