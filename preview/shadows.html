<!doctype html>
<!-- @dsCard group="Spacing" name="Shadow system" subtitle="Neutral lift + tinted indigo" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.box{width:140px;height:80px;background:#fff;border:1px solid #E1E1E9;border-radius:8px;display:flex;align-items:center;justify-content:center;font:500 11px var(--ra-font-mono);color:#6B7280}
.s1{box-shadow:0 1px 2px rgba(24,27,37,.06)}
.s2{box-shadow:0 2px 6px rgba(24,27,37,.06),0 1px 2px rgba(24,27,37,.04)}
.s3{box-shadow:0 8px 20px rgba(50,50,93,.08),0 2px 6px rgba(0,0,0,.04)}
.s4{box-shadow:0 18px 40px rgba(50,50,93,.18),0 6px 14px rgba(0,0,0,.06)}
.s5{box-shadow:0 18px 40px rgba(205,205,255,.5),0 4px 10px rgba(205,205,255,.3)}
</style></head><body>
<div class="box s1">xs</div>
<div class="box s2">sm</div>
<div class="box s3">md</div>
<div class="box s4">lg</div>
<div class="box s5">tinted</div>
</body></html>
