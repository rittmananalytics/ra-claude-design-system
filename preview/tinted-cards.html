<!doctype html>
<!-- @dsCard group="Components" name="Tinted cards" subtitle="Soft-fill illustration cards" viewport="700x220" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--ra-font-body)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{padding:18px;border-radius:8px;display:flex;flex-direction:column;gap:6px;min-height:84px}
.tile h4{margin:0;font-size:14px;font-weight:600;color:#181B25}
.tile p{margin:0;font-size:12px;color:#181B25;line-height:1.4;opacity:.75}
.indigo{background:#E0E0FF}
.violet{background:#E6DBFF}
.mint{background:#EBFFEB}
.sky{background:#E7F7FE}
.peach{background:#FFBBBE}
.haze{background:#EFF0FF}
</style></head><body>
<div class="grid">
  <div class="tile indigo"><h4>Build</h4><p>Scalable data foundations.</p></div>
  <div class="tile violet"><h4>Modernise</h4><p>Skills, tech, ways of working.</p></div>
  <div class="tile mint"><h4>Embed</h4><p>Customer-facing analytics.</p></div>
  <div class="tile sky"><h4>Solve</h4><p>Looker, dbt, Cube, BigQuery.</p></div>
  <div class="tile peach"><h4>Modernise</h4><p>Diagnostic deep dive.</p></div>
  <div class="tile haze"><h4>Discover</h4><p>Hard truths, lasting change.</p></div>
</div>
</body></html>
