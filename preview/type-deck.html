<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">

<p class="note">Deck type · Google Sans</p>
<div class="r">

  <div class="row"><span class="tag">Eyebrow 14</span><span class="spec" style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.18em;color:var(--ra-indigo);font-family:var(--ra-font-deck-ui)">Where we are · BigQuery + dbt</span></div>
