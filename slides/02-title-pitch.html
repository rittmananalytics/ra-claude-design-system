<!doctype html>
<!-- @dsCard group="Slides" name="slide-02-title-pitch" subtitle="Title slide — pitch deck variant" viewport="1280x720" -->
<html lang="en"><head><meta charset="utf-8"><title>Title slide — pitch</title>
<link rel="stylesheet" href="../colors_and_type.css?v=2">
<link rel="stylesheet" href="slides.css?v=2">
<style>
  /* Pitch deck title — full-bleed client photo + dark-left vignette,
     Indigo eyebrow, white title, presenter list bottom-left, RA logo top-left,
     Google Cloud Partner badge bottom-right. */
  .t-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .t-overlay { position:absolute; inset:0; background:
    linear-gradient(to right, rgba(20,22,30,0.88) 0%, rgba(20,22,30,0.72) 45%, rgba(20,22,30,0.40) 100%); }
  .t-eyebrow { position:absolute; left:56px; top:200px; font:600 16px/1.2 var(--ra-font-deck-ui);
    color:#87A0FF; letter-spacing:0.16em; text-transform:uppercase; margin:0; z-index:2; }
  .t-title { position:absolute; left:56px; right:56px; top:236px; font:700 78px/1.05 var(--ra-font-deck-display);
    letter-spacing:-0.025em; margin:0; max-width:920px; text-wrap:pretty; color:#fff;
    text-shadow:0 2px 24px rgba(0,0,0,0.4); z-index:2; }
  .t-presenters { position:absolute; left:56px; bottom:130px; z-index:2; }
  .t-presenters p { font:500 22px/1.5 var(--ra-font-deck-body); color:rgba(255,255,255,.92); margin:0; }
  .t-partner { position:absolute; bottom:30px; right:48px; height:48px; z-index:5; }
  .t-partner img { height:100%; display:block; }
</style>
</head><body>
<div class="ra-slide-stage">
  <div class="ra-slide s-dark" data-screen-label="02 Title — pitch">
    <img class="t-bg" src="../assets/template/booksy_title_bg.png" alt="">
    <div class="t-overlay"></div>
    <a class="ra-logo"><img src="../assets/logo-white-blue.svg" alt="Rittman Analytics"></a>
    <p class="t-eyebrow">Tuesday 10th March 2026 · Madrid</p>
    <h1 class="t-title">Booksy Innovation Day:<br>Looker</h1>
    <div class="t-presenters">
      <p>Mark Rittman, CEO, Rittman Analytics</p>
      <p>Alex Caldwell, Consultant, Rittman Analytics</p>
    </div>
    <div class="t-partner"><img src="../assets/template/google_partner.png" alt="Google Cloud Partner"></div>
  </div>
</div>
<script>(()=>{const s=document.querySelector('.ra-slide');const fit=()=>{const r=Math.min(window.innerWidth/1280,window.innerHeight/720);s.style.transform=`scale(${r})`;};fit();addEventListener('resize',fit);})();</script>
</body></html>
