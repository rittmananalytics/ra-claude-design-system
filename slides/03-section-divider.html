<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Section divider</title>
<link rel="stylesheet" href="../colors_and_type.css?v=2">
<link rel="stylesheet" href="slides.css?v=2">
</head><body>
<div class="ra-slide-stage">
  <div class="ra-slide s-deep" data-screen-label="03 Section divider">
    <a class="ra-logo"><img src="../assets/logo-white-blue.svg" alt="Rittman Analytics"></a>
    <div class="ra-section-center">
      <div>
        <p class="ra-eyebrow on-indigo" style="margin-bottom:18px;">Part One</p>
        <h2>Review of 2025</h2>
        <p class="sub">Where we started, what shipped, and what we learned.</p>
      </div>
    </div>
    <div class="ra-foot on-indigo">
      <span>© Rittman Analytics 2026</span>
      <span>T: +44 (0)208 058 5951</span>
      <span>W: rittmananalytics.com</span>
      <span>E: info@rittmananalytics.com</span>
    </div>
  </div>
</div>
<script>(()=>{const s=document.querySelector('.ra-slide');const fit=()=>{const r=Math.min(window.innerWidth/1280,window.innerHeight/720);s.style.transform=`scale(${r})`;};fit();addEventListener('resize',fit);})();</script>
</body></html>
