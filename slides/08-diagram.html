<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Diagram slide</title>
<link rel="stylesheet" href="../colors_and_type.css?v=2">
<link rel="stylesheet" href="slides.css?v=2">
<style>
  .d-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:32px; }
  .d-meta { font:600 13px/1 var(--ra-font-deck-ui); color:#4F60FF; text-transform:uppercase; letter-spacing:0.14em; white-space:nowrap; align-self:flex-end; }
  .d-img { flex:1; display:flex; align-items:center; justify-content:center; background:#F7F7FA;
    border-radius:12px; padding:24px; min-height:0; overflow:hidden; }
  .d-img img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
</style>
</head><body>
<div class="ra-slide-stage">
  <div class="ra-slide s-light" data-screen-label="08 Diagram">
    <a class="ra-logo"><img src="../assets/logo-black-blue.svg" alt="Rittman Analytics"></a>
    <div class="ra-body">
      <div class="d-head">
        <div>
          <p class="ra-eyebrow">Reference Architecture</p>
          <h2 class="ra-title sm" style="max-width:780px;">A modern data stack that earns its keep.</h2>
        </div>
        <span class="d-meta">Extract · Store · Present</span>
      </div>
      <div class="d-img"><img src="../assets/illustrations/data-architecture-overview-v2.png" alt="Data architecture overview"></div>
    </div>
    <div class="ra-foot">
      <span>© Rittman Analytics 2026</span>
      <span>T: +44 (0)208 058 5951</span>
      <span>W: rittmananalytics.com</span>
      <span>E: info@rittmananalytics.com</span>
    </div>
  </div>
</div>
<script>(()=>{const s=document.querySelector('.ra-slide');const fit=()=>{const r=Math.min(window.innerWidth/1280,window.innerHeight/720);s.style.transform=`scale(${r})`;};fit();addEventListener('resize',fit);})();</script>
</body></html>
