<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Closing slide</title>
<link rel="stylesheet" href="../colors_and_type.css?v=2">
<link rel="stylesheet" href="slides.css?v=2">
<style>
  .close-wrap { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .close-wrap h2 { font:700 78px/1.05 var(--ra-font-deck-display); letter-spacing:-0.025em;
    margin:0; color:#181B25; max-width:1040px; text-wrap:pretty; }
  .close-wrap h2 b { color:#4F60FF; font-weight:700; }
  .close-meta { display:flex; gap:64px; margin-top:48px; }
  .close-meta div { font:400 18px/1.5 var(--ra-font-deck-body); color:#4F5564; }
  .close-meta strong { display:block; color:#181B25; font:700 22px/1.2 var(--ra-font-deck-display);
    margin-bottom:6px; letter-spacing:-0.01em; }
</style>
</head><body>
<div class="ra-slide-stage">
  <div class="ra-slide s-light" data-screen-label="14 Closing">
    <a class="ra-logo"><img src="../assets/logo-black-blue.svg" alt="Rittman Analytics"></a>
    <div class="ra-body">
      <div class="close-wrap">
        <p class="ra-eyebrow" style="margin-bottom:16px;">Thank you · Let's talk</p>
        <h2>Ready to confront the <b>hard truths</b> in your data?</h2>
        <div class="close-meta">
          <div><strong>Email</strong>info@rittmananalytics.com</div>
          <div><strong>Schedule</strong>rittmananalytics.com/discovery</div>
          <div><strong>Podcast</strong>Drill to Detail</div>
        </div>
      </div>
    </div>
    <div class="ra-foot">
      <span>© Rittman Analytics 2026</span>
      <span>T: +44 (0)208 058 5951</span>
      <span>W: rittmananalytics.com</span>
      <span>E: info@rittmananalytics.com</span>
    </div>
  </div>
</div>
<script>(()=>{const s=document.querySelector('.ra-slide');const fit=()=>{const r=Math.min(window.innerWidth/1280,window.innerHeight/720);s.style.transform=`scale(${r})`;};fit();addEventListener('resize',fit);})();</script>
</body></html>
