<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 200px;width:1280px;height:854px}
.main{background:#4F60FF;display:grid;place-items:center}
.main img{width:640px;display:block}
.strip{display:grid;grid-template-rows:1fr 1fr 1fr 1fr}
.s1{background:#99FF99}.s2{background:#87D5FC}.s3{background:#AD86FF}.s4{background:#FF8D73}
</style></head><body>
<div class="tile">
<div class="main"><img src="assets/logo-white.svg" alt="Rittman Analytics"></div>
<div class="strip"><div class="s1"></div><div class="s2"></div><div class="s3"></div><div class="s4"></div></div>
</div>
</body></html>
